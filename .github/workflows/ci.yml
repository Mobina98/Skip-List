name: CI

on:
  push:
    branches: [main, feature/SkipList]
  pull_request:
    branches: [main, feature/SkipList]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Build GoogleTest
        run: |
          cmake -S submodules/googletest -B submodules/googletest/build
          cmake --build submodules/googletest/build

      - name: Run tests (build and execute)
        run: make run_tests

      - name: List tests folder for debugging
        run: ls -l tests/
